<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="pencilMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGlow7)"/>
  <ellipse cx="400" cy="690" rx="300" ry="26" fill="#0f172a" opacity="0.14"/>

  <!-- Ultra-thin Long Pencil SMPS -->
  <g filter="url(#shadow7)" transform="translate(400, 390)">
    <!-- Main Low-profile Strip Body -->
    <rect x="-340" y="-35" width="680" height="70" rx="8" fill="url(#pencilMetal)" stroke="#64748b" stroke-width="2"/>

    <!-- Left Terminal Block (AC IN) -->
    <rect x="-330" y="-25" width="50" height="50" rx="4" fill="#0f172a"/>
    <circle cx="-315" cy="-10" r="4" fill="#ca8a04"/>
    <circle cx="-315" cy="10" r="4" fill="#ca8a04"/>
    <text x="-315" y="22" text-anchor="middle" fill="#94a3b8" font-size="8">L N</text>

    <!-- Center Product Printing -->
    <text x="0" y="-6" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">SAMARTH SLEEK PENCIL SMPS · ULTRA THIN</text>
    <text x="0" y="14" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">OUTPUT: 12V DC CONSTANT VOLTAGE · COVE PROFILE READY</text>

    <!-- Right Terminal Block (DC OUT) -->
    <rect x="280" y="-25" width="50" height="50" rx="4" fill="#0f172a"/>
    <circle cx="295" cy="-10" r="4" fill="#ca8a04"/>
    <circle cx="295" cy="10" r="4" fill="#ca8a04"/>
    <text x="295" y="22" text-anchor="middle" fill="#94a3b8" font-size="8">+ -</text>
  </g>

  <!-- Product Badge -->
  <g transform="translate(400, 720)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0f172a" opacity="0.88"/>
    <text x="0" y="6" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">SLEEK PENCIL PROFILE DRIVER</text>
  </g>
</svg>