<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="blueNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="centerWhite" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGlow)"/>
  
  <!-- Soft ground shadow -->
  <ellipse cx="400" cy="690" rx="260" ry="32" fill="#0f172a" opacity="0.12"/>
  
  <!-- Main Panel Body -->
  <g filter="url(#shadow)" transform="translate(0, -20)">
    <!-- Outer Die-Cast Bezel -->
    <circle cx="400" cy="400" r="280" fill="url(#metalRim)" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Neon Blue Halo Ring (Side Blue Dual Glow) -->
    <circle cx="400" cy="400" r="260" fill="none" stroke="#0284c7" stroke-width="24" filter="url(#blueNeon)" opacity="0.95"/>
    <circle cx="400" cy="400" r="248" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.9"/>
    
    <!-- Inner White Reflector Ring -->
    <circle cx="400" cy="400" r="236" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Central White Frosted Diffuser Disc -->
    <circle cx="400" cy="400" r="226" fill="url(#centerWhite)"/>
    <circle cx="400" cy="400" r="226" fill="#38bdf8" opacity="0.04"/>
    
    <!-- Spring Mounting Clips (Side Wings) -->
    <rect x="90" y="385" width="30" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <path d="M 100 385 L 70 340" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <rect x="680" y="385" width="30" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <path d="M 700 385 L 730 340" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Product Badge -->
  <g transform="translate(400, 720)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#0f172a" opacity="0.88"/>
    <text x="0" y="6" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">SIDE-BLUE DUAL GLOW</text>
  </g>
</svg>