<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgGlow8)"/>
  <ellipse cx="400" cy="700" rx="240" ry="30" fill="#0f172a" opacity="0.14"/>

  <g filter="url(#shadow8)" transform="translate(400, 390)">
    <!-- Outer Die-Cast Bezel -->
    <circle cx="0" cy="0" r="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="0" cy="0" r="200" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Frosted Opal Button Diffuser Disc -->
    <circle cx="0" cy="0" r="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="0" r="160" fill="#fef08a" opacity="0.3"/>
    <circle cx="-30" cy="-30" r="40" fill="#ffffff" opacity="0.8"/>

    <!-- Side Spring Snaps for Standard Concealed Box Mounting -->
    <rect x="-245" y="-15" width="20" height="30" rx="4" fill="#f97316"/>
    <rect x="225" y="-15" width="20" height="30" rx="4" fill="#f97316"/>
  </g>

  <!-- Product Badge -->
  <g transform="translate(400, 720)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0f172a" opacity="0.88"/>
    <text x="0" y="6" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">JUNCTION & BUTTON LIGHT</text>
  </g>
</svg>