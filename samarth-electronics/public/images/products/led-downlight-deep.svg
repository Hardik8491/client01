<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="deepCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGlow3)"/>
  <ellipse cx="400" cy="700" rx="260" ry="32" fill="#0f172a" opacity="0.14"/>

  <g filter="url(#shadow3)" transform="translate(400, 390)">
    <!-- Outer Flush Ceiling Ring -->
    <circle cx="0" cy="0" r="260" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="0" cy="0" r="240" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Deep Anti-Glare Dark Step Baffle -->
    <circle cx="0" cy="0" r="200" fill="url(#deepCone)" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="0" r="170" fill="#090d16" stroke="#1e293b" stroke-width="4"/>
    <circle cx="0" cy="0" r="140" fill="#030712"/>

    <!-- Faceted Specular Aluminium Reflector Core -->
    <circle cx="0" cy="0" r="110" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="0" cy="0" r="80" fill="#64748b"/>

    <!-- High-CRI COB Light Source (Warm/Neutral Daylight) -->
    <circle cx="0" cy="0" r="50" fill="#fef08a" stroke="#eab308" stroke-width="3"/>
    <circle cx="-10" cy="-10" r="12" fill="#ffffff" opacity="0.8"/>

    <!-- Heavy Side Tension Spring Arms -->
    <path d="M -260 0 L -310 -60" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <path d="M 260 0 L 310 -60" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Product Badge -->
  <g transform="translate(400, 720)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0f172a" opacity="0.88"/>
    <text x="0" y="6" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">DEEP ANTI-GLARE DOWNLIGHT</text>
  </g>
</svg>